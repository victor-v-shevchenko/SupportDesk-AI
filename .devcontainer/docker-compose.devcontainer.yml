# Added on top of ../docker-compose.yml by devcontainer.json.
# Compose resolves relative paths from the first file's folder (the repository root),
# so "." below is the repository root and ".env" is the root .env file.
services:
  dev:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    command: sleep infinity
    volumes:
      - .:/workspaces/SupportDesk-AI:cached
    env_file:
      - .env
    environment:
      ConnectionStrings__SupportDesk: "Host=db;Port=5432;Database=${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB};Username=${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}"
      # Ollama runs on the host
      AI__Ollama__Endpoint: "http://host.docker.internal:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
