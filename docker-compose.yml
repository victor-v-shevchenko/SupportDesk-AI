# One project name, so `docker compose` at the root and the dev container share the same database
name: supportdesk-ai

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/SupportDesk.Api/Dockerfile
    environment:
      # Development applies the migrations at startup; this compose file is for local use only
      # Keep the connection string in sync with .devcontainer/docker-compose.devcontainer.yml
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SupportDesk: "Host=db;Port=5432;Database=${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB};Username=${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}"
      # Ollama on the host by default; set OLLAMA_ENDPOINT=http://ollama:11434 in .env for the ollama service
      AI__Ollama__Endpoint: "${OLLAMA_ENDPOINT:-http://host.docker.internal:11434}"
      # Provider choice and keys come from .env; empty keys are fine for Ollama and Fake
      AI__Chat__Provider: "${AI_CHAT_PROVIDER:-Ollama}"
      AI__Embeddings__Provider: "${AI_EMBEDDINGS_PROVIDER:-Ollama}"
      # Empty means the provider's default model (OpenAI chat has none, so set AI_CHAT_MODEL for it)
      AI__Chat__Model: "${AI_CHAT_MODEL:-}"
      AI__Embeddings__Model: "${AI_EMBEDDINGS_MODEL:-}"
      # The fake embeddings are hashes, so with them use 0, or every retrieved chunk is dropped
      Retrieval__MinSimilarity: "${RETRIEVAL_MIN_SIMILARITY:-0.5}"
      AI__Anthropic__ApiKey: "${ANTHROPIC_API_KEY:-}"
      AI__OpenAI__ApiKey: "${OPENAI_API_KEY:-}"
      AI__Voyage__ApiKey: "${VOYAGE_API_KEY:-}"
      # Empty means no traces, metrics or logs are exported. With the telemetry profile running: http://telemetry:18889 (PLAN.md 14)
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:5080:5080"
    depends_on:
      db:
        condition: service_healthy

  # Optional: Ollama in a container, for machines without Ollama on the host. Only starts with the profile:
  #   docker compose --profile ollama up -d ollama
  # Containers in this project (api, the dev container) reach it at http://ollama:11434
  ollama:
    image: ollama/ollama:0.40.4
    profiles: ["ollama"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama

  # Optional: the .NET Aspire dashboard, which takes OTLP traces, metrics and logs and shows them. Only starts with the profile:
  #   docker compose --profile telemetry up -d telemetry
  # Containers in this project (api, the dev container) send to http://telemetry:18889; open http://localhost:18888.
  # Both ports are bound to the host's loopback only, and the dashboard runs without a login, so keep it that way
  telemetry:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5.2
    profiles: ["telemetry"]
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"
      - "127.0.0.1:18889:18889"

  web:
    build: ./web
    environment:
      # The dev server proxies /api here (web/proxy.conf.mjs)
      API_URL: "http://api:5080"
    ports:
      - "127.0.0.1:4200:4200"
    depends_on:
      - api

volumes:
  pgdata:
  ollama:
